name: README MCP Portability

on:
  pull_request:
    paths:
      - 'README.md'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: evals/package-lock.json

      - name: Install linter dependencies
        working-directory: evals
        run: npm ci

      - name: Reject host-assigned Azure MCP tool names
        working-directory: evals
        run: node lint-skills.js
