name: Azure MCP Guidance Contract

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'providers/**'
      - 'skills/**'
      - '.mcp.json'
      - 'plugin.json'
      - '.claude-plugin/**'
      - 'evals/lint-skills.js'
      - 'evals/lint-skills.test.js'
      - '.github/workflows/readme-mcp-portability.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: evals/package-lock.json

      - name: Install linter dependencies
        working-directory: evals
        run: npm ci

      - name: Lint shipped Azure MCP guidance
        working-directory: evals
        run: |
          node lint-skills.js
          node lint-skills.test.js
