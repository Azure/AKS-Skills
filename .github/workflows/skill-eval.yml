name: Skill Evaluation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Specific skill to validate (leave empty for all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: evals/package-lock.json

      - name: Install dependencies
        working-directory: evals
        run: npm ci

      - name: Lint skill contract
        working-directory: evals
        run: npm run lint

      - name: Test contract linter (fixtures and CLI exit codes)
        working-directory: evals
        run: npm run lint:selftest

      - name: Test mock dispatcher fail-closed behavior
        working-directory: evals
        run: node --test mocks/lib/dispatch.test.mjs

      - name: Test trusted evaluation policy
        working-directory: evals
        run: npm run test:ci-policy

      - name: Test selective skill context
        working-directory: evals
        run: npm run test:deep-content

      - name: Test llm-client backend auto-detection
        working-directory: evals
        run: npm test

      - name: Enforce agentic fail-closed contracts
        working-directory: evals
        run: npm run lint:agentic

      - name: Record exact validated pull request commit
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: node evals/scripts/record-validation-target.mjs --output "$RUNNER_TEMP/validation-target/target.json"

      - name: Upload immutable validation target
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-target/target.json
          if-no-files-found: error
