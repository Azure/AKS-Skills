contract_version: "1.0"
provider:
  id: azure-mcp
  product: Azure MCP Server
  package: "@azure/mcp"
  version: 3.0.0-beta.32
  release_ref: Azure.Mcp.Server-3.0.0-beta.32
  source_commit: 0fe54df28d473415d63c201b309b64eec0aa6587
  source_url: https://github.com/microsoft/mcp/tree/Azure.Mcp.Server-3.0.0-beta.32/tools/Azure.Mcp.Tools.Aks
transport:
  type: stdio
  trust_boundary: Host-launched local process using the provider's configured Azure identity.
context:
  sources:
    - advertised-tool-schema
    - azure-scope
fallback_policy:
  allowed_reasons:
    - absent
    - unsupported
  stop_reasons:
    - authorization-denied
    - context-mismatch
capabilities:
  - id: azure.aks.cluster.read
    published_operation: aks cluster get
    class: read
    context_sources:
      - azure-scope
    fallback_class: direct-azure-cli
    tested_schema:
      required: []
      optional:
        - tenant
        - subscription
        - resource-group
        - cluster
        - retry-delay
        - retry-max-delay
        - retry-max-retries
        - retry-mode
        - retry-network-timeout
  - id: azure.aks.nodepool.read
    published_operation: aks nodepool get
    class: read
    context_sources:
      - azure-scope
    fallback_class: direct-azure-cli
    tested_schema:
      required:
        - resource-group
        - cluster
      optional:
        - tenant
        - subscription
        - nodepool
        - retry-delay
        - retry-max-delay
        - retry-max-retries
        - retry-mode
        - retry-network-timeout
unsupported:
  - AKS Automatic readiness assessment or remediation
  - Kubernetes API operations
  - AKS mutations
non_goals:
  - Map AppLens, Azure Monitor, or Resource Health as AKS-area operations; they are separate Azure MCP areas.
  - Define host-rendered tool aliases.
