# AKS Skills Evaluation Configuration
# Runs skill quality checks using promptfoo
#
# Usage:
#   npx promptfoo eval                    # run all evals
#   npx promptfoo eval --filter-failing   # re-run only failures
#   npx promptfoo view                    # open results UI
#
# Required env vars:
#   AZURE_OPENAI_API_KEY + AZURE_OPENAI_ENDPOINT  (preferred)
#   OR OPENAI_API_KEY                              (fallback)

description: "AKS Skills Quality Evaluation"

providers:
  - id: file://providers/skill-provider.js
    label: "AKS Skill Provider"
    config:
      model: gpt-4o
      temperature: 0.3

# Prompt is handled inside the custom provider (injects SKILL.md as system context).
# This passthrough is required by promptfoo schema.
prompts:
  - "{{prompt}}"

tests:
  - file://tests/aks-sre/trigger-tests.yaml
  - file://tests/aks-sre/quality-tests.yaml
  - file://tests/network-troubleshoot/trigger-tests.yaml
  - file://tests/network-troubleshoot/quality-tests.yaml

# LLM-as-judge for llm-rubric assertions.
# Custom provider needed because Azure OpenAI gpt-4o rejects 'max_tokens'
# (requires 'max_completion_tokens') and promptfoo's built-in provider sends 'max_tokens'.
defaultTest:
  options:
    provider:
      id: file://providers/judge-provider.js
      config:
        model: gpt-4o
