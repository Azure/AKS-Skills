# AKS Skills Evaluation Configuration
# Runs skill quality checks using promptfoo
#
# Usage:
#   npx promptfoo eval                    # run quality evals
#   npx promptfoo eval --filter-failing   # re-run only failures
#   npx promptfoo view                    # open results UI
#
# For routing (trigger) tests, see promptfoo-routing.yaml.
# For baseline comparison (quality tests only), see promptfoo-baseline.yaml.
#
# Required env vars:
#   FOUNDRY_ENDPOINT + FOUNDRY_ACCESS_TOKEN (or FOUNDRY_API_KEY)  (CI)
#   OR AZURE_OPENAI_API_KEY + AZURE_OPENAI_ENDPOINT
#   OR GITHUB_MODELS_TOKEN                                        (local dev only)
# See providers/llm-client.js for the full list.

description: "AKS Skills Quality Evaluation"

providers:
  - id: file://providers/skill-provider.js
    label: "AKS Skill Provider"

# Prompt is handled inside the custom provider (injects SKILL.md as system context).
# This passthrough is required by promptfoo schema.
prompts:
  - "{{prompt}}"

tests:
  - file://tests/aks-sre/quality-tests.yaml
  - file://tests/network-troubleshoot/quality-tests.yaml

# LLM-as-judge for g-eval/llm-rubric assertions.
# Custom provider needed because promptfoo's built-in azureopenai provider sends
# 'max_tokens' which newer Azure OpenAI deployments reject.
# See: https://github.com/promptfoo/promptfoo/issues/6153
defaultTest:
  options:
    provider:
      id: file://providers/judge-provider.js
