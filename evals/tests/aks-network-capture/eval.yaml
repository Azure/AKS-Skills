# Vally eval config for the aks-network-capture routing boundary.
# Every routing stimulus sees the full AKS skill pool so selection is competitive.

name: aks-network-capture-agentic-eval
description: |
  Agentic routing evaluation for aks-network-capture. Explicit packet-capture
  intent must invoke this skill; generic AKS connectivity remains owned by
  aks-troubleshooting.
tags:
  type: integration
  skill: aks-network-capture

environment:
  skills:
    - ../../../skills/aks-automatic-readiness
    - ../../../skills/aks-cluster-setup
    - ../../../skills/aks-cost-optimization
    - ../../../skills/aks-gpu-inference
    - ../../../skills/aks-known-issues
    - ../../../skills/aks-network-capture
    - ../../../skills/aks-troubleshooting

defaults:
  runs: 1
  executor: copilot-sdk
  model: claude-sonnet-4.6
  judge_model: claude-sonnet-4.6

stimuli:
  - name: "Routing: explicit node packet capture"
    prompt: "Capture packets on the AKS node hosting my pod and give me a pcap so I can prove where port 443 traffic is being dropped."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-network-capture
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Discrimination: generic egress failure stays with troubleshooting"
    prompt: "Pods in my AKS cluster cannot reach external services and egress seems blocked. Help me investigate."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: discrimination
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-network-capture
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
