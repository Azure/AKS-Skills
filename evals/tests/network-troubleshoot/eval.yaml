# Vally eval config for network-troubleshoot skill
# Tests skill invocation, output quality, and tool awareness

name: network-troubleshoot-agentic-eval
description: |
  Agentic evaluation for network-troubleshoot skill — tests that the
  agent correctly invokes the skill and produces network-diagnostic
  responses for AKS connectivity scenarios.
tags:
  type: integration
  skill: network-troubleshoot

environment:
  skills:
    - ../../../skills/providers/azure/network-troubleshoot

defaults:
  runs: 1
  timeout: "5m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 0.8

stimuli:
  # ── Routing: DNS resolution failure ──
  - name: "Routing: DNS resolution failure"
    prompt: "My pods can't resolve DNS names in my AKS cluster. I suspect CoreDNS or an NSG blocking UDP 53. Help me investigate."
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
    graders:
      - type: skill-invocation
        config:
          required:
            - network-troubleshoot
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
    constraints:
      expect_skills:
        - network-troubleshoot

  # ── Routing: egress blocked ──
  - name: "Routing: egress traffic blocked"
    prompt: "Pods in my AKS cluster can't reach external services and egress seems blocked. What should I do?"
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: routing
    graders:
      - type: skill-invocation
        config:
          required:
            - network-troubleshoot
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
    constraints:
      expect_skills:
        - network-troubleshoot

  # ── Output: references packet capture workflow ──
  - name: "Output: references packet capture diagnostic step"
    prompt: "Traffic between two pods in my AKS cluster is being dropped intermittently. Investigate the network path."
    tags:
      type: integration
      tier: full
      cost: llm
      area: output
    graders:
      - type: completed
      - type: output-matches
        config:
          pattern: "(?i)packet capture|pcap|tcpdump|capture|create-capture|node"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
    constraints:
      expect_skills:
        - network-troubleshoot

  # ── Output: references Azure network resources ──
  - name: "Output: references Azure network resources"
    prompt: "Pods in my AKS cluster cannot reach an Azure service endpoint. Run an investigation and provide findings."
    tags:
      type: integration
      tier: full
      cost: llm
      area: output
    graders:
      - type: completed
      - type: output-matches
        config:
          pattern: "(?i)NSG|network security group|route table|firewall|VNET|peering|endpoint|DNS"
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
    constraints:
      expect_skills:
        - network-troubleshoot
