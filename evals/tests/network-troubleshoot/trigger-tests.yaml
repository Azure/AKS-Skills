# network-troubleshoot trigger tests
# Validates that prompts are correctly routed (or not routed) to this skill
#
# To add/modify tests: just add new entries to this array.
# Each test needs: description, vars (prompt + skill_path), assert

- description: "Egress blocked should trigger network-troubleshoot skill"
  metadata:
    skill: network-troubleshoot
  vars:
    skill_path: "providers/azure/network-troubleshoot/SKILL.md"
    prompt: "Pods can't reach external services, egress seems blocked"
  assert:
    - type: llm-rubric
      value: "Response provides network-specific troubleshooting including NSG rules, network policies, or firewall investigation"

- description: "DNS resolution failure should trigger network-troubleshoot skill"
  metadata:
    skill: network-troubleshoot
  vars:
    skill_path: "providers/azure/network-troubleshoot/SKILL.md"
    prompt: "DNS resolution is failing inside my pods"
  assert:
    - type: llm-rubric
      value: "Response addresses DNS-specific diagnosis including CoreDNS, resolv.conf, or Azure DNS configuration"

- description: "OOMKilled should NOT produce network troubleshooting"
  metadata:
    skill: network-troubleshoot
  vars:
    skill_path: "providers/azure/network-troubleshoot/SKILL.md"
    prompt: "My pod keeps getting OOMKilled with exit code 137"
  assert:
    - type: llm-rubric
      value: "Response acknowledges this is a memory issue not a networking issue, rather than providing network diagnostic steps"
