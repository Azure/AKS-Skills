# network-troubleshoot trigger tests (routing)
# Validates that prompts are correctly routed (or not routed) to this skill
#
# These tests run via promptfoo-routing.yaml using the router-provider,
# which returns a skill id (e.g. "network-troubleshoot") or "none".
# Assertions are deterministic string equality — no LLM judge needed.

- description: "Egress blocked should trigger network-troubleshoot skill"
  metadata:
    skill: network-troubleshoot
    type: trigger
  vars:
    prompt: "Pods can't reach external services, egress seems blocked"
  assert:
    - type: equals
      value: "network-troubleshoot"

- description: "DNS resolution failure should trigger network-troubleshoot skill"
  metadata:
    skill: network-troubleshoot
    type: trigger
  vars:
    prompt: "Pods can't resolve DNS names, I suspect CoreDNS or NSG blocking UDP 53"
  assert:
    - type: equals
      value: "network-troubleshoot"

- description: "OOMKilled should trigger aks-sre (not network-troubleshoot)"
  metadata:
    skill: aks-sre
    type: trigger
  vars:
    prompt: "My pod keeps getting OOMKilled with exit code 137"
  assert:
    - type: equals
      value: "aks-sre"
