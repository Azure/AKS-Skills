# aks-troubleshooting trigger tests (routing)
# Validates that prompts route (or do not route) to this skill.
#
# Run via promptfoo-routing.yaml using the router-provider, which returns a
# skill id (e.g. "aks-troubleshooting") or "none". Assertions are deterministic
# string equality — no LLM judge.

- description: "CrashLoopBackOff should route to aks-troubleshooting"
  metadata:
    skill: aks-troubleshooting
    type: trigger
  vars:
    prompt: "A pod in my cluster is stuck in CrashLoopBackOff"
  assert:
    - type: equals
      value: "aks-troubleshooting"

- description: "Node NotReady should route to aks-troubleshooting"
  metadata:
    skill: aks-troubleshooting
    type: trigger
  vars:
    prompt: "My nodes are showing NotReady status after an upgrade"
  assert:
    - type: equals
      value: "aks-troubleshooting"

# These public canaries pair each AKS case with a source-shaped non-AKS near
# miss so the full router pool exercises both the intended route and "none".

- description: "Public canary quota-exceeded should route to aks-troubleshooting"
  metadata:
    skill: aks-troubleshooting
    type: trigger
    case_id: public-canary-quota-exceeded
    set: public-canary
    source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
  vars:
    prompt: "An existing non-GPU AKS user node pool failed to scale. The failed Azure operation says the requested regional vCPU capacity exceeds the available quota. Investigate without changing resources."
  assert:
    - type: equals
      value: "aks-troubleshooting"

- description: "Public canary quota-exceeded non-AKS near miss should route to none"
  metadata:
    skill: aks-troubleshooting
    type: trigger
    case_id: public-canary-quota-exceeded
    set: public-canary
    source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
  vars:
    prompt: "A standalone Azure virtual machine scale set, unrelated to AKS or Kubernetes, failed because the requested regional vCPU capacity exceeds the available quota."
  assert:
    - type: equals
      value: "none"

- description: "Public canary dns-nsg-udp53 should route to aks-troubleshooting"
  metadata:
    skill: aks-troubleshooting
    type: trigger
    case_id: public-canary-dns-nsg-udp53
    set: public-canary
    source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
  vars:
    prompt: "Pods in an AKS cluster cannot resolve names between node pools. UDP 53 from pool-a to pool-b is denied while TCP 443 is allowed. Investigate; I am not asking for packet capture."
  assert:
    - type: equals
      value: "aks-troubleshooting"

- description: "Public canary dns-nsg-udp53 non-AKS near miss should route to none"
  metadata:
    skill: aks-troubleshooting
    type: trigger
    case_id: public-canary-dns-nsg-udp53
    set: public-canary
    source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
  vars:
    prompt: "Pods in a self-managed Kubernetes cluster outside Azure and AKS cannot resolve names between node pools. UDP 53 is denied while TCP 443 is allowed."
  assert:
    - type: equals
      value: "none"

- description: "Non-Kubernetes VM resize should route to no skill"
  metadata:
    skill: aks-troubleshooting
    type: trigger
  vars:
    prompt: "How do I resize my Azure VM that's not part of any Kubernetes cluster?"
  assert:
    - type: equals
      value: "none"

# Reciprocal boundary tests: aks-known-issues owns named/documented error
# codes and messages, including upgrade-specific ones; aks-troubleshooting
# keeps generic, open-ended upgrade investigation with no stable signature.

- description: "Boundary: an upgrade failure naming NodePoolMcVersionIncompatible must go to aks-known-issues, not aks-troubleshooting"
  metadata:
    skill: aks-troubleshooting
    type: trigger
  vars:
    prompt: "My node pool upgrade is blocked with error NodePoolMcVersionIncompatible — what does that mean?"
  assert:
    - type: equals
      value: "aks-known-issues"

- description: "Boundary: a generic stuck upgrade with no error code stays with aks-troubleshooting"
  metadata:
    skill: aks-troubleshooting
    type: trigger
  vars:
    prompt: "My AKS cluster upgrade has been stuck for an hour with no error code shown, can you investigate?"
  assert:
    - type: equals
      value: "aks-troubleshooting"
