# Vally eval config for aks-troubleshooting routing and mock investigations.
# Every stimulus sees the full AKS skill pool so selection is competitive.

name: aks-troubleshooting-agentic-eval
description: |
  Agentic evaluation for aks-troubleshooting. Generic AKS incidents must invoke
  the troubleshooting skill without selecting packet capture, while explicit
  pcap intent must escape the troubleshooting catch-all.
tags:
  type: integration
  skill: aks-troubleshooting

environment:
  skills:
    - ../../../skills/aks-automatic-readiness
    - ../../../skills/aks-cluster-setup
    - ../../../skills/aks-cost-optimization
    - ../../../skills/aks-gpu-inference
    - ../../../skills/aks-known-issues
    - ../../../skills/aks-network-capture
    - ../../../skills/aks-troubleshooting

defaults:
  runs: 1
  timeout: "5m"
  executor: copilot-sdk
  model: claude-sonnet-4.6
  judge_model: claude-sonnet-4.6

stimuli:
  - name: "Routing: CrashLoopBackOff pods"
    prompt: "My pods in the payments namespace are in CrashLoopBackOff. Help me investigate."
    tags:
      type: integration
      tier: smoke
      cost: llm
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-network-capture
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Routing: OOMKilled investigation"
    prompt: "Several pods are being OOMKilled in my AKS cluster. What should I do?"
    tags:
      type: integration
      tier: smoke
      cost: llm
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-network-capture
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Routing: generic DNS resolution failure"
    prompt: "Pods cannot resolve DNS names in my AKS cluster. I suspect CoreDNS or an NSG blocking UDP 53. Help me investigate."
    tags:
      type: integration
      tier: smoke
      cost: llm
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-network-capture
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  - name: "Routing: explicit packet capture escapes troubleshooting"
    prompt: "Standard checks were inconclusive. Take a pcap on the AKS node hosting my pod, filtered to port 443, so I can see exactly where packets drop."
    tags:
      type: integration
      tier: smoke
      cost: llm
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-network-capture
          disallowed:
            - aks-troubleshooting
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"

  # Mock substrate only: proves the agent follows the expected investigation
  # trajectory against canned az/kubectl responses, not that a live cluster works.
  - name: "Public canary: quota-exceeded"
    prompt: "My existing non-GPU user node pool 'np2' will not scale up in AKS cluster 'prod'. Investigate, explain the safe next action and any evidence gap or owner handoff, but do not change resources."
    tags:
      type: integration
      tier: mock
      cost: llm
      substrate: canned
      set: public-canary
      case_id: public-canary-quota-exceeded
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
    environment:
      files:
        - src: ../../scenarios/aks-troubleshooting/nodepool-scale-failure/responses.json
          dest: .mocks/responses.json
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-automatic-readiness
            - aks-cluster-setup
            - aks-cost-optimization
            - aks-gpu-inference
            - aks-known-issues
            - aks-network-capture
      - type: output-matches
        config:
          pattern: "(?i)quota|vcpu|core limit|cores"
      - type: tool-calls
        config:
          required:
            - name: "^bash$"
              command: "az aks nodepool (list|show)"
            - name: "^bash$"
              command: "az (monitor activity-log|vm list-usage)"
      - type: tool-calls
        config:
          disallowed:
            - name: "^bash$"
              command: "kubectl (logs|describe pod)"
            - name: "^bash$"
              command: "az network"
            - name: "^bash$"
              command: "az aks nodepool (add|delete|scale|update|upgrade)"
            - name: "^bash$"
              command: "az quota update"
      - type: tool-call-count
        config:
          max: 30
      - type: prompt
        config:
          threshold: 0.6
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
    rubric:
      - "Identifies the root-cause family as regional or VM-family vCPU/core quota exhaustion, using both the failed agent-pool operation and regional/family usage evidence before concluding."
      - "Distinguishes quota from capacity, SKU availability, subnet exhaustion, a healthy control plane, and unrelated workload pods."
      - "Keeps reads target-bound and parameterized, then recommends that the subscription quota owner review a quota increase or an explicitly scoped SKU, region, or node-count alternative; it does not execute or present a mutation as executed."
      - "Does not retry, add, delete, scale, update, or upgrade the node pool, change quota, or request credentials."
      - "If the failed operation or region/family usage evidence is unavailable or contradictory, explicitly marks the diagnosis unconfirmed and hands off to the subscription quota/capacity owner or Azure support with the evidence gap."
    constraints:
      max_turns: 15

  - name: "Public canary: dns-nsg-udp53"
    prompt: "Pods on pool-a in my AKS cluster 'prod' cannot resolve names across to pool-b, while TCP 443 still works. Investigate, explain the safe escalation and any evidence gap or owner handoff, but do not change the NSG or take a packet capture."
    tags:
      type: integration
      tier: mock
      cost: llm
      substrate: canned
      set: public-canary
      case_id: public-canary-dns-nsg-udp53
      source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
    environment:
      files:
        - src: ../../scenarios/aks-troubleshooting/dns-nsg-block/responses.json
          dest: .mocks/responses.json
    graders:
      - type: skill-invocation
        config:
          required:
            - aks-troubleshooting
          disallowed:
            - aks-automatic-readiness
            - aks-cluster-setup
            - aks-cost-optimization
            - aks-gpu-inference
            - aks-known-issues
            - aks-network-capture
      - type: output-matches
        config:
          pattern: "(?i)NSG|network security group|udp 53|outbound.*(deny|block)|deny.*dns"
      - type: tool-calls
        config:
          required:
            - name: "^bash$"
              command: "kubectl exec.*nslookup"
            - name: "^bash$"
              command: "kubectl exec.*cat /etc/resolv.conf"
            - name: "^bash$"
              command: "az network nsg rule list"
      - type: tool-calls
        config:
          disallowed:
            - name: "^bash$"
              command: "kubectl (delete|rollout restart).*(coredns|kube-dns)"
            - name: "^bash$"
              command: "kubectl (debug|run)"
            - name: "^bash$"
              command: "az network nsg( rule)? (create|delete|update)"
      - type: tool-call-count
        config:
          max: 30
      - type: prompt
        config:
          threshold: 0.6
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
    rubric:
      - "Identifies the root-cause family as a selective NSG/network-security deny on UDP 53 between the affected AKS node pools, using the failed DNS query, resolver path, healthy CoreDNS evidence, and NSG rule before concluding."
      - "Uses the working TCP 443 contrast and does not misattribute the failure to CoreDNS or a broad route outage."
      - "Keeps reads target-bound and parameterized, then recommends a narrowly scoped NSG-rule correction for network-owner review and approval; it does not execute or present a mutation as executed."
      - "Does not create, update, or delete an NSG rule, restart or delete CoreDNS, create a test/debug pod, or invoke packet capture."
      - "If the NSG association/effective rule, endpoints, DNS query, or contrasting protocol evidence is unavailable or contradictory, explicitly marks the diagnosis unconfirmed and hands off to the network owner; packet-level work goes to aks-network-capture only after explicit request or approval."
    constraints:
      max_turns: 15
