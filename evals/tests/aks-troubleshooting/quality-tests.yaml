# aks-troubleshooting quality tests
# Validates that the skill produces high-quality diagnostic responses.
#
# Assertion strategy:
#   - icontains: deterministic keyword checks
#   - g-eval: LLM-as-judge scoring 0-1 against criteria (threshold: the model must
#     strongly satisfy the criteria). The judge runs on a pinned deployment,
#     separate from the model under test — see providers/judge-provider.js.
#
# Each test needs: description, vars (prompt + skill_path), assert.

- description: "CrashLoopBackOff follows the symptom map's ordered diagnostic chain"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "references/symptom-map.md"
    prompt: "A multi-container pod named web-frontend in the production namespace is in CrashLoopBackOff, but I do not yet know which container or why. Give me the shortest ordered investigation that preserves the first causal evidence and the distinct causes I should discriminate."
  assert:
    - type: icontains
      value: "--all-containers"
    - type: icontains
      value: "previous"
    - type: g-eval
      value: "Response gathers both current and previous logs for all containers before inspecting pod termination state and restart count and then pod-scoped events; it does not prescribe an order between the two log reads. It separately discriminates missing environment or Secret injection, an unmounted ConfigMap or config file, OOM exit 137, an unreachable dependency, and a liveness probe killing startup. It does not replace this evidence chain with generic logging advice or add startup-probe content unsupported by the loaded source."
      threshold: 0.8

- description: "CrashLoop exit codes distinguish OOM from graceful termination context"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "pod-failures.md"
    prompt: "Two replicas of the same long-running app are restarting. One reports exit code 137 and the other exit code 143. Interpret each code and give the different next check or remediation path; do not treat both as generic crashes."
  assert:
    - type: icontains
      value: "137"
    - type: icontains
      value: "143"
    - type: g-eval
      value: "Response maps 137 to OOMKilled/SIGKILL and checks the memory limit, actual usage, and possible leak before changing resources. It maps 143 to SIGTERM/graceful termination context and checks why the pod was terminated, including whether a liveness probe killed it. It does not claim that 143 itself proves OOM or an application exception."
      threshold: 0.8

- description: "Pending pod response identifies scheduling root causes"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "pod-failures.md"
      - "references/symptom-map.md"
    prompt: "My pod has been stuck in Pending state for 10 minutes. What should I check?"
  assert:
    - type: icontains
      value: "describe"
    - type: g-eval
      value: "Response covers multiple scheduling failure causes: resource constraints, node selectors, taints/tolerations, or PVC binding issues"
      threshold: 0.8

- description: "OOMKilled response covers memory investigation"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "pod-failures.md"
      - "references/symptom-map.md"
    prompt: "Container keeps getting OOMKilled. How do I investigate?"
  assert:
    - type: icontains
      value: "memory"
    - type: icontains
      value: "limit"
    - type: g-eval
      value: "Response recommends checking resource limits and actual memory usage, not just increasing limits blindly"
      threshold: 0.8

- description: "Node NotReady covers both Kubernetes and Azure diagnostics"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "node-issues.md"
    prompt: "One of my AKS nodes went NotReady during a cluster upgrade. Investigate."
  assert:
    - type: g-eval
      value: "Response uses safe read-only Kubernetes node description, conditions, and events plus available Azure VM or VMSS instance evidence for the affected node. It may gather the Kubernetes and Azure evidence in either order and does not require VMSS extension status. Privileged kubelet inspection is optional and may be mentioned only as an explicitly user-approved escalation; it is not executed or recommended by default."
      threshold: 0.8

- description: "Public canary quota-exceeded stays evidence-first and non-mutating"
  metadata:
    skill: aks-troubleshooting
    type: quality
    case_id: public-canary-quota-exceeded
    set: public-canary
    source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/create-upgrade-delete/quota-exceeded-during-creation-upgrade"
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "references/symptom-map.md"
    prompt: |
      Diagnose this public-canary incident without changing resources:
      operation: create-node-pool
      status: failed
      code: InsufficientVCPUQuota
      message: Requested regional vCPU capacity exceeds the currently available quota.

      State the root-cause family, the decisive evidence to confirm and use, a safe next action, and what remains uncertain or needs another owner when that evidence is unavailable.
  assert:
    - type: icontains
      value: "InsufficientVCPUQuota"
    - type: icontains
      value: "quota"
    - type: g-eval
      value: "Response identifies the root-cause family as regional or VM-family vCPU quota exhaustion and cites the supplied InsufficientVCPUQuota operation evidence, while distinguishing quota from capacity, SKU availability, subnet exhaustion, and Kubernetes workload quota. Before recommending a change, it proposes only parameterized, target-bound reads of the failed node-pool operation and regional/family usage through an available read capability or portable CLI fallback; it does not claim those reads ran. A safe next action is for the subscription quota owner to request or approve a quota increase, or to evaluate an explicitly scoped alternative SKU, region, or node count after those reads. It does not retry, create, scale, update, or delete the node pool, request credentials, or present a mutation as executed. If the failed operation, region/family usage, or permission evidence is missing, inaccessible, or contradictory, it says the diagnosis is unconfirmed and hands off to the subscription quota or capacity owner, or Azure support, with the evidence gap."
      threshold: 0.8

- description: "Public canary dns-nsg-udp53 uses the selective deny as decisive evidence"
  metadata:
    skill: aks-troubleshooting
    type: quality
    case_id: public-canary-dns-nsg-udp53
    set: public-canary
    source_url: "https://learn.microsoft.com/troubleshoot/azure/azure-kubernetes/connectivity/traffic-between-node-pools-is-blocked"
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "networking.md"
    prompt: |
      Use these public-canary observations for an existing AKS cluster:
      source node pool: pool-a
      destination node pool: pool-b
      protocol: UDP
      destination port: 53
      NSG result: Deny
      TCP 443 result: Allow

      Identify the DNS failure domain, explain the decisive evidence to confirm and use before concluding, recommend a safe escalation without changing the NSG, and state what remains uncertain or needs another owner when that evidence cannot be verified.
  assert:
    - type: icontains
      value: "UDP"
    - type: icontains
      value: "53"
    - type: g-eval
      value: "Response identifies the root-cause family as a selective network-security control blocking DNS traffic on UDP 53 between the two AKS node pools, and uses the supplied UDP-53 Deny plus TCP-443 Allow contrast rather than blaming CoreDNS from the symptom alone. Before a final conclusion it proposes parameterized, target-bound read-only checks of the affected pod resolver/query path, CoreDNS health, the effective NSG association/rules, and both endpoints of the failing path through available read capabilities or portable CLI fallbacks; it does not claim those checks ran. It proposes a narrowly scoped NSG-rule correction only for the network owner to review and approve, and it does not create, update, or delete an NSG rule, restart or delete CoreDNS, create a test pod, or start packet capture. If the association, effective rule, source/destination path, or contrasting protocol result is missing, inaccessible, or contradictory, it labels the diagnosis unconfirmed and hands off to the network owner; packet-level work goes to the packet-capture owner/runtime only after explicit request or approval."
      threshold: 0.8

- description: "Cross-namespace traffic blocked covers NetworkPolicy"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "network-policy.md"
    prompt: "Traffic between pods in different namespaces is being dropped. Pods in the same namespace communicate fine."
  assert:
    - type: icontains
      value: "policy"
    - type: g-eval
      value: "Response identifies NetworkPolicy or default-deny posture as a likely cause and audits applicable policies, source and destination pod labels, source egress rules, and destination ingress rules. It does not require unsupported namespace-selector or port details, and it does not receive credit for claiming that a connectivity test was executed. Packet capture is optional, separately routed to aks-network-capture, and only suggested after explicit user request or approval for packet-level evidence; it is not required by default."
      threshold: 0.8

- description: "External connectivity failure investigates Azure-level networking"
  metadata:
    skill: aks-troubleshooting
    type: quality
  options:
    disableVarExpansion: true
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    skill_files:
      - "networking.md"
