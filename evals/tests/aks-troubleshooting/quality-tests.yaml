# aks-troubleshooting quality tests
# Validates that the skill produces high-quality diagnostic responses.
#
# Assertion strategy:
#   - icontains: deterministic keyword checks
#   - g-eval: LLM-as-judge scoring 0-1 against criteria (threshold: the model must
#     strongly satisfy the criteria). The judge runs on a pinned deployment,
#     separate from the model under test — see providers/judge-provider.js.
#
# Each test needs: description, vars (prompt + skill_path), assert.

- description: "CrashLoopBackOff response includes proper diagnostics"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "A pod named web-frontend in the production namespace is in CrashLoopBackOff. Help me investigate."
  assert:
    - type: icontains
      value: "logs"
    - type: icontains
      value: "previous"
    - type: g-eval
      value: "Response mentions checking container exit codes or restart reasons, not just suggesting to look at logs generically"
      threshold: 0.8

- description: "Pending pod response identifies scheduling root causes"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "My pod has been stuck in Pending state for 10 minutes. What should I check?"
  assert:
    - type: icontains
      value: "describe"
    - type: g-eval
      value: "Response covers multiple scheduling failure causes: resource constraints, node selectors, taints/tolerations, or PVC binding issues"
      threshold: 0.8

- description: "OOMKilled response covers memory investigation"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "Container keeps getting OOMKilled. How do I investigate?"
  assert:
    - type: icontains
      value: "memory"
    - type: icontains
      value: "limit"
    - type: g-eval
      value: "Response recommends checking resource limits and actual memory usage, not just increasing limits blindly"
      threshold: 0.8

- description: "Node NotReady covers both Kubernetes and Azure diagnostics"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "One of my AKS nodes went NotReady during a cluster upgrade. Investigate."
  assert:
    - type: g-eval
      value: "Response includes both Kubernetes-level checks (kubectl describe node, kubelet status) AND Azure-level checks (VM instance view, extension status)"
      threshold: 0.8

- description: "DNS failure response covers the full diagnostic path"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "Pods can't resolve DNS names. Internal service discovery and external DNS both failing."
  assert:
    - type: icontains
      value: "CoreDNS"
    - type: g-eval
      value: "Response covers the DNS diagnostic chain: pod resolv.conf, CoreDNS pods, upstream/forwarder DNS, and potential NSG blocks on UDP 53"
      threshold: 0.8

- description: "Cross-namespace traffic blocked covers NetworkPolicy"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "Traffic between pods in different namespaces is being dropped. Pods in the same namespace communicate fine."
  assert:
    - type: icontains
      value: "policy"
    - type: g-eval
      value: "Response identifies NetworkPolicy as a likely cause and recommends checking policy rules, with packet capture as a verification step"
      threshold: 0.8

- description: "External connectivity failure investigates Azure-level networking"
  metadata:
    skill: aks-troubleshooting
    type: quality
  vars:
    skill_path: "aks-troubleshooting/SKILL.md"
    prompt: "My AKS pods can reach other pods but cannot reach external Azure services like Azure SQL."
  assert:
    - type: g-eval
      value: "Response investigates Azure-level networking: NSG rules on the subnet, route tables, service/private endpoints, and Azure Firewall if applicable"
      threshold: 0.8
