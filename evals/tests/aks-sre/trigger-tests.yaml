# aks-sre trigger tests
# Validates that prompts are correctly routed (or not routed) to this skill
#
# To add/modify tests: just add new entries to this array.
# Each test needs: description, vars (prompt + skill_path), assert

- description: "CrashLoopBackOff should trigger aks-sre skill"
  metadata:
    skill: aks-sre
  vars:
    skill_path: "providers/azure/aks-sre/SKILL.md"
    prompt: "A pod in my cluster is stuck in CrashLoopBackOff"
  assert:
    - type: llm-rubric
      value: "Response provides Kubernetes-specific troubleshooting steps for a CrashLoopBackOff pod, not generic advice"

- description: "Node NotReady should trigger aks-sre skill"
  metadata:
    skill: aks-sre
  vars:
    skill_path: "providers/azure/aks-sre/SKILL.md"
    prompt: "My nodes are showing NotReady status after an upgrade"
  assert:
    - type: llm-rubric
      value: "Response addresses AKS node health investigation including kubelet, containerd, or Azure VM diagnostics"

- description: "VM resize should NOT produce AKS troubleshooting"
  metadata:
    skill: aks-sre
  vars:
    skill_path: "providers/azure/aks-sre/SKILL.md"
    prompt: "How do I resize my Azure VM that's not part of any Kubernetes cluster?"
  assert:
    - type: llm-rubric
      value: "Response either redirects to Azure VM documentation or explicitly states this is outside AKS troubleshooting scope, rather than providing Kubernetes-specific investigation steps"
