# aks-sre trigger tests (routing)
# Validates that prompts are correctly routed (or not routed) to this skill
#
# These tests run via promptfoo-routing.yaml using the router-provider,
# which returns a skill id (e.g. "aks-sre") or "none".
# Assertions are deterministic string equality — no LLM judge needed.

- description: "CrashLoopBackOff should trigger aks-sre skill"
  metadata:
    skill: aks-sre
    type: trigger
  vars:
    prompt: "A pod in my cluster is stuck in CrashLoopBackOff"
  assert:
    - type: equals
      value: "aks-sre"

- description: "Node NotReady should trigger aks-sre skill"
  metadata:
    skill: aks-sre
    type: trigger
  vars:
    prompt: "My nodes are showing NotReady status after an upgrade"
  assert:
    - type: equals
      value: "aks-sre"

- description: "VM resize should NOT trigger any skill"
  metadata:
    skill: aks-sre
    type: trigger
  vars:
    prompt: "How do I resize my Azure VM that's not part of any Kubernetes cluster?"
  assert:
    - type: equals
      value: "none"
